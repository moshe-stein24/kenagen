[package]
name = "kenagen"
version = "0.1.0"
edition = "2021"
description = "A Yamaha-style keyboard emulator played on a standard computer keyboard"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.17"
evdev = "0.13"
